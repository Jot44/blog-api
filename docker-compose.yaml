services:
  banco_bapidb:
    image: postgres:18.6
    container_name: bapi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - dados_bapi:/var/lib/postgresql

volumes:
  dados_bapi:
